<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangFlow-QnA</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #eef2ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); height: 100vh;
            display: flex; flex-direction: column;
        }

        /* ── Layout ── */
        .app-layout { display: flex; height: 100vh; }
        .sidebar {
            width: 320px; background: var(--surface); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* ── Sidebar ── */
        .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 {
            font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .sidebar-header p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .sidebar-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .sidebar-section h2 {
            font-size: 11px; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
        }

        /* ── Upload Area ── */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-sm);
            padding: 20px 16px; text-align: center; cursor: pointer;
            transition: all 0.2s; position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary); background: var(--primary-light);
        }
        .upload-zone .icon { font-size: 28px; margin-bottom: 6px; }
        .upload-zone .label { font-size: 13px; color: var(--text-secondary); }
        .upload-zone .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .upload-zone input[type="file"] { display: none; }
        .upload-status { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
        .upload-status.success { color: #16a34a; }
        .upload-status.error { color: #dc2626; }

        /* ── Knowledge List ── */
        .doc-list { display: flex; flex-direction: column; gap: 6px; }
        .doc-item {
            font-size: 12px; padding: 6px 10px; background: var(--bg);
            border-radius: 6px; display: flex; align-items: center; gap: 6px;
            color: var(--text-secondary);
        }
        .doc-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ── Chat Header ── */
        .chat-header {
            padding: 14px 24px; background: var(--surface);
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between;
        }
        .chat-header h2 { font-size: 15px; font-weight: 600; }
        .chat-header .status {
            font-size: 11px; color: var(--text-secondary);
            display: flex; align-items: center; gap: 4px;
        }
        .chat-header .status .dot {
            width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
        }

        /* ── Messages ── */
        #chat-container {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .msg {
            max-width: 72%; padding: 12px 16px; border-radius: var(--radius);
            line-height: 1.65; font-size: 14px; word-break: break-word;
            animation: fadeIn 0.25s ease;
        }
        .msg.user {
            align-self: flex-end; background: var(--primary); color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            align-self: flex-start; background: var(--surface);
            color: var(--text); box-shadow: var(--shadow);
            border-bottom-left-radius: 4px;
        }
        .msg.bot .loading {
            display: inline-flex; gap: 3px; align-items: center;
        }
        .msg.bot .loading span {
            width: 6px; height: 6px; background: var(--primary); border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .msg.bot .loading span:nth-child(2) { animation-delay: 0.2s; }
        .msg.bot .loading span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100% { transform: scale(0.6); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .welcome {
            margin: auto; text-align: center; padding: 40px 20px;
        }
        .welcome .icon { font-size: 48px; margin-bottom: 12px; }
        .welcome h3 { font-size: 18px; font-weight: 600; color: var(--text); }
        .welcome p { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
        .welcome .examples {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px;
        }
        .welcome .examples button {
            padding: 6px 14px; font-size: 12px; background: var(--primary-light);
            border: 1px solid var(--border); border-radius: 20px; cursor: pointer;
            color: var(--primary); transition: all 0.2s;
        }
        .welcome .examples button:hover { background: var(--primary); color: #fff; }

        /* ── Input ── */
        #input-area {
            background: var(--surface); border-top: 1px solid var(--border);
            padding: 16px 24px; display: flex; gap: 10px; align-items: flex-end;
            margin-top: auto;
        }
        #input-area textarea {
            flex: 1; resize: none; border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 14px;
            font-size: 14px; outline: none; font-family: inherit;
            min-height: 44px; max-height: 120px; line-height: 1.5;
            transition: border-color 0.2s;
        }
        #input-area textarea:focus { border-color: var(--primary); }
        #input-area button {
            background: var(--primary); color: #fff; border: none;
            border-radius: var(--radius-sm); padding: 0 22px; height: 44px;
            font-size: 14px; cursor: pointer; white-space: nowrap;
            transition: background 0.2s; font-weight: 500;
        }
        #input-area button:hover { background: var(--primary-hover); }
        #input-area button:disabled { background: #94a3b8; cursor: not-allowed; }

        /* ── Scrollbar ── */
        #chat-container::-webkit-scrollbar, .sidebar::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-track, .sidebar::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb, .sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .msg { max-width: 88%; font-size: 13px; }
            #input-area { padding: 12px 16px; }
            #chat-container { padding: 16px; }
        }

        /* ── Upload modal (mobile file dialog fallback) ── */
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px;
            font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>LangFlow-QnA</h1>
                <p>基于 LangChain + LangGraph 的问答系统</p>
            </div>

            <div class="sidebar-section">
                <h2>📄 上传文档</h2>
                <div class="upload-zone" id="uploadZone">
                    <div class="icon">📁</div>
                    <div class="label">点击或拖拽文件到此处</div>
                    <div class="hint">支持 .txt .md .py .js .json 等文本格式</div>
                    <input type="file" id="fileInput" accept=".txt,.md,.py,.js,.ts,.json,.csv" />
                </div>
                <div class="upload-status" id="uploadStatus"></div>
            </div>

            <div class="sidebar-section" style="flex:1; overflow-y:auto;">
                <h2>📚 知识库文档</h2>
                <div class="doc-list" id="docList">
                    <div style="font-size:12px;color:#94a3b8;">暂无文档，请上传</div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main">
            <div class="chat-header">
                <h2>💬 对话</h2>
                <div class="status"><span class="dot"></span> 服务运行中</div>
            </div>

            <div id="chat-container">
                <div class="welcome" id="welcome">
                    <div class="icon">🤖</div>
                    <h3>你好！我是 LangFlow 助手</h3>
                    <p>上传知识文档后，我可以回答文档中的任何问题</p>
                    <div class="examples">
                        <button onclick="ask('2024年营收多少')">2024年营收多少</button>
                        <button onclick="ask('公司有多少员工')">公司有多少员工</button>
                        <button onclick="ask('主要产品有哪些')">主要产品有哪些</button>
                    </div>
                </div>
            </div>

            <div id="input-area">
                <textarea id="input" rows="1" placeholder="输入消息..." autofocus></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ── State ──
        const sessionId = 'web-' + Date.now();
        let uploading = false;

        // ── DOM refs ──
        const container = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = document.getElementById('welcome');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');
        const docList = document.getElementById('docList');

        // ── Toast ──
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ── Chat ──
        function addMessage(text, role, loading = false) {
            welcome?.remove();
            const el = document.createElement('div');
            el.className = 'msg ' + role;
            if (loading) {
                el.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
            } else {
                el.textContent = text;
            }
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
            return el;
        }

        function ask(text) {
            input.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');
            const botEl = addMessage('', 'bot', true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await res.json();
                botEl.textContent = '';
                botEl.textContent = data.reply;
            } catch (err) {
                botEl.textContent = '';
                botEl.textContent = '请求失败，请检查服务是否运行';
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ── Upload ──
        async function uploadFile(file) {
            if (uploading) return;
            uploading = true;
            uploadStatus.textContent = '⏳ 上传中...';
            uploadStatus.className = 'upload-status';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/documents/upload', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();
                if (res.ok) {
                    uploadStatus.textContent = `✅ ${data.message}`;
                    uploadStatus.className = 'upload-status success';
                    showToast(`成功导入 ${data.chunks} 个片段`);
                    refreshDocList();
                } else {
                    uploadStatus.textContent = `❌ ${data.detail || '上传失败'}`;
                    uploadStatus.className = 'upload-status error';
                }
            } catch (err) {
                uploadStatus.textContent = '❌ 上传失败，请检查服务';
                uploadStatus.className = 'upload-status error';
            } finally {
                uploading = false;
                fileInput.value = '';
            }
        }

        function refreshDocList() {
            // 简单从上传状态推断，暂时显示提示
            docList.innerHTML = '<div style="font-size:12px;color:#94a3b8;">文档已上传，可开始问答</div>';
        }

        // ── Events ──
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); sendMessage();
            }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // Upload click
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            if (e.target.files.length) uploadFile(e.target.files[0]);
        });

        // Drag & drop
        uploadZone.addEventListener('dragover', e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });
    </script>
</body>
</html>
