<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangFlow-QnA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            background: #f0f2f5; color: #1a1a2e;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 16px 24px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        header h1 { font-size: 20px; font-weight: 600; }
        header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

        #chat-container {
            flex: 1; overflow-y: auto; padding: 20px 16px;
            display: flex; flex-direction: column; gap: 12px;
            max-width: 800px; width: 100%; margin: 0 auto;
        }
        .msg {
            max-width: 75%; padding: 10px 16px; border-radius: 12px;
            line-height: 1.6; font-size: 14px; word-break: break-word;
            animation: fadeIn 0.25s ease;
        }
        .msg.user {
            align-self: flex-end; background: #667eea; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            align-self: flex-start; background: #fff; color: #1a1a2e;
            border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .msg.bot.streaming { border-left: 3px solid #667eea; }
        .msg .loading {
            display: inline-block; width: 8px; height: 8px;
            background: #667eea; border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #input-area {
            border-top: 1px solid #e0e0e0; background: #fff; padding: 12px 16px;
            display: flex; gap: 8px; max-width: 800px; width: 100%; margin: 0 auto;
        }
        #input-area textarea {
            flex: 1; resize: none; border: 1px solid #ddd; border-radius: 8px;
            padding: 10px 12px; font-size: 14px; outline: none; font-family: inherit;
            min-height: 44px; max-height: 120px;
        }
        #input-area textarea:focus { border-color: #667eea; }
        #input-area button {
            background: #667eea; color: #fff; border: none; border-radius: 8px;
            padding: 0 20px; font-size: 14px; cursor: pointer; white-space: nowrap;
            transition: background 0.2s;
        }
        #input-area button:hover { background: #5a6fd6; }
        #input-area button:disabled { background: #b0b8f0; cursor: not-allowed; }

        .welcome {
            text-align: center; color: #888; margin: auto;
            padding: 40px 20px;
        }
        .welcome h2 { font-size: 18px; color: #555; margin-bottom: 8px; }
        .welcome p { font-size: 13px; }

        @media (max-width: 600px) {
            .msg { max-width: 90%; font-size: 13px; }
            header h1 { font-size: 17px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>💬 LangFlow-QnA</h1>
        <p>基于 LangChain + LangGraph 的知识库问答 Agent</p>
    </header>

    <div id="chat-container">
        <div class="welcome" id="welcome">
            <h2>👋 你好！我是 LangFlow 助手</h2>
            <p>问我关于 LangFlow 公司的问题，比如"2024年营收多少"</p>
        </div>
    </div>

    <div id="input-area">
        <textarea id="input" rows="1" placeholder="输入消息..." autofocus></textarea>
        <button id="send-btn">发送</button>
    </div>

    <script>
        const container = document.getElementById('chat-container');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const welcome = document.getElementById('welcome');

        let sessionId = 'web-' + Date.now();

        function addMessage(text, role, streaming = false) {
            welcome?.remove();
            const el = document.createElement('div');
            el.className = 'msg ' + role + (streaming ? ' streaming' : '');
            el.textContent = text;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
            return el;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            addMessage(text, 'user');

            const botEl = addMessage('...', 'bot', true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: sessionId })
                });
                const data = await res.json();
                botEl.textContent = data.reply;
                botEl.classList.remove('streaming');
            } catch (err) {
                botEl.textContent = '请求失败：' + err.message;
                botEl.classList.remove('streaming');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Events
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
