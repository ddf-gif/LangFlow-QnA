<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>LangFlow · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🧠</text></svg>"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4A7BA7;--primary-hover:#3B6390;--primary-light:#E8EFF6;
  --bg:#F4F6FA;--surface:#FFFFFF;
  --text:#1A2332;--text-secondary:#5A6B7F;--text-muted:#8E9DB2;
  --border:#E2E6ED;
  --success:#4CAF84;--error:#D95C5C;
  --shadow-lg:0 8px 24px rgba(0,0,0,0.06);
  --radius:12px;
  --font:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --transition:0.2s ease;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
input,button,select{font-family:var(--font);font-size:14px}

.page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

/* Card */
.card{background:var(--surface);border-radius:var(--radius);width:400px;max-width:100%;padding:40px 36px 32px;box-shadow:var(--shadow-lg)}
.card .logo{text-align:center;font-size:36px;margin-bottom:4px}
.card h1{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px}
.card .sub{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:28px}

/* Tabs */
.tabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:20px}
.tabs .tab{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition);background:var(--surface);color:var(--text-muted)}
.tabs .tab.act{background:var(--primary);color:#fff}
.tabs .tab:not(.act):hover{background:var(--border-light, #EDF0F5)}

/* Role selector */
.role-sel{display:flex;gap:8px;margin-bottom:16px}
.role-sel .ro{flex:1;padding:10px;border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all var(--transition);font-size:13px;font-weight:500;color:var(--text-secondary);background:var(--surface)}
.role-sel .ro:hover{border-color:var(--primary-light)}
.role-sel .ro.act{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.role-sel .ro .ic{font-size:20px;display:block;margin-bottom:2px}

/* Form */
.pf{margin-bottom:14px}
.pf label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
.pf input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:border var(--transition)}
.pf input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(74,123,167,0.1)}

.btn{width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all var(--transition);margin-top:4px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.err{font-size:13px;color:var(--error);margin-top:6px;display:none;text-align:center}

.foot{text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px}
.foot a{cursor:pointer;color:var(--primary);font-weight:500;text-decoration:none}

/* Toggle between login/register */
.form-area{display:block}
.form-area.hide{display:none}
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="logo">🧠</div>
    <h1>LangFlow</h1>
    <div class="sub">知识库智能问答平台</div>

    <!-- Tabs: Login / Register -->
    <div class="tabs">
      <div class="tab act" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabReg" onclick="switchTab('register')">注册</div>
    </div>

    <!-- Role Selector (only for login) -->
    <div class="role-sel" id="roleSelector">
      <div class="ro act" data-role="user" onclick="selectRole(this)">
        <span class="ic">👤</span>用户登录
      </div>
      <div class="ro" data-role="admin" onclick="selectRole(this)">
        <span class="ic">⚙️</span>管理员登录
      </div>
    </div>

    <!-- Login Form -->
    <div class="form-area" id="loginForm">
      <div class="pf"><label>用户名</label><input id="loginUser" type="text" placeholder="输入用户名" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div class="pf"><label>密码</label><input id="loginPass" type="password" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">登录</button>
      <div class="foot">还没有账号？<a onclick="switchTab('register')">立即注册</a></div>
    </div>

    <!-- Register Form -->
    <div class="form-area hide" id="regForm">
      <div class="pf"><label>用户名</label><input id="regUser" type="text" placeholder="至少 2 个字符" onkeydown="if(event.key==='Enter')doRegister()"/></div>
      <div class="pf"><label>密码</label><input id="regPass" type="password" placeholder="至少 4 个字符" onkeydown="if(event.key==='Enter')doRegister()"/></div>
      <div class="err" id="regErr"></div>
      <button class="btn btn-primary" id="regBtn" onclick="doRegister()">注册</button>
      <div class="foot">已有账号？<a onclick="switchTab('login')">去登录</a></div>
    </div>
  </div>
</div>

<script>
let curRole='user';

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
  if(tab==='login'){
    document.getElementById('tabLogin').classList.add('act');
    document.getElementById('loginForm').classList.remove('hide');
    document.getElementById('regForm').classList.add('hide');
    document.getElementById('roleSelector').style.display='flex';
  }else{
    document.getElementById('tabReg').classList.add('act');
    document.getElementById('regForm').classList.remove('hide');
    document.getElementById('loginForm').classList.add('hide');
    document.getElementById('roleSelector').style.display='none';
  }
  document.querySelectorAll('.err').forEach(e=>e.style.display='none');
}

function selectRole(el){
  document.querySelectorAll('.role-sel .ro').forEach(r=>r.classList.remove('act'));
  el.classList.add('act');
  curRole=el.dataset.role;
}

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const err=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  if(!u||!p){err.textContent='请填写用户名和密码';err.style.display='block';return}
  btn.disabled=true;btn.textContent='登录中...';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'登录失败');
    // 验证角色匹配
    if(curRole==='admin'&&d.role!=='admin'){throw new Error('该账号不是管理员');}
    if(curRole==='user'&&d.role==='admin'){/* 管理员也可以以用户身份进入C端，允许 */}

    localStorage.setItem('token',d.token);
    localStorage.setItem('username',d.username);
    localStorage.setItem('role',d.role);

    // 根据角色跳转
    if(curRole==='admin'){window.location.href='/admin/';}
    else{window.location.href='/';}
  }catch(e){
    err.textContent=e.message;err.style.display='block';
    btn.disabled=false;btn.textContent='登录';
  }
}

async function doRegister(){
  const u=document.getElementById('regUser').value.trim();
  const p=document.getElementById('regPass').value.trim();
  const err=document.getElementById('regErr');
  const btn=document.getElementById('regBtn');
  if(!u||u.length<2){err.textContent='用户名至少 2 个字符';err.style.display='block';return}
  if(!p||p.length<4){err.textContent='密码至少 4 个字符';err.style.display='block';return}
  btn.disabled=true;btn.textContent='注册中...';
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||'注册失败');
    // 注册成功，自动登录
    localStorage.setItem('token',d.token);
    localStorage.setItem('username',d.username);
    localStorage.setItem('role','user');
    window.location.href='/';
  }catch(e){
    err.textContent=e.message;err.style.display='block';
    btn.disabled=false;btn.textContent='注册';
  }
}

// 如果已登录，直接跳转
(function(){
  const token=localStorage.getItem('token');
  const role=localStorage.getItem('role');
  if(token&&role){
    if(role==='admin'){window.location.href='/admin/';return;}
    else{window.location.href='/';return;}
  }
})();
</script>
</body>
</html>
