[project]
name = "langflow-qa"
version = "0.1.0"
description = "基于 LangChain + LangGraph 的知识库智能问答 Agent 系统"
requires-python = ">=3.10"
dependencies = [
    # ---- Phase 1: 基础 LLM 调用 ----
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint>=4.1",
    "langchain-openai>=0.2",

    # ---- Phase 2: RAG 相关 ----
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",

    # ---- Phase 5: Web 服务 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",

    # ---- 通用工具 ----
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
]

[project.optional-dependencies]
docx = [
    "unstructured[pdf,docx,pptx]>=0.16",
    "pdfplumber>=0.11",
]
db = [
    "sqlalchemy>=2",
    "asyncpg>=0.30",
    "alembic>=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
